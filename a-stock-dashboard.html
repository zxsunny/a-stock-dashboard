    }
    .search-box input:focus { border-color: var(--brand); }

    .btn {
      padding: 0.6rem 1.2rem;

      border-radius: 8px;
      font-family: var(--font);

      cursor: pointer;

    }

    .toast {

      white-space: nowrap;

    .news-content {

    .macro-news-item.intl { border-left-color: var(--info); }
    .macro-news-head {

      align-items: flex-start;
      gap: 0.6rem;
      margin-bottom: 0.3rem;
    }
    .macro-news-tags { display: flex; gap: 0.3rem; align-items: center; flex-wrap: wrap; }
    .macro-news-tag {
      font-size: 0.62rem;
      padding: 0.08rem 0.4rem;
      border-radius: 3px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .macro-news-tag.domestic { background: rgba(239,68,68,0.15); color: var(--accent); }
    .macro-news-tag.intl { background: rgba(59,130,246,0.18); color: #60a5fa; }
    .macro-news-tag.urgent { background: rgba(239,68,68,0.18); color: #ef4444; }

    .macro-news-tag.industry { background: rgba(245,158,11,0.18); color: var(--accent2); }

    .macro-news-detail {
      margin: 0.35rem 0 0.25rem 1.1rem;
      padding: 0.5rem 0.65rem;
      background: rgba(255,255,255,0.04);

      margin-bottom: 0.3rem;
    }
    .index-change {

    /* Macro */
    .macro-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
    }
    .macro-card {

      border: 1px solid var(--rule);

      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    .macro-desc {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* Chart */
    .chart-container {
      width: 100%;
      height: 320px;
      margin-top: 1rem;
    }
    .chart-note {

      color: var(--muted);
      padding: 0.35rem 0.6rem;
      background: rgba(245, 158, 11, 0.08);

      border-radius: 4px;

      line-height: 1.4;

    /* Tabs */
    .tabs {

      border-bottom: 1px solid var(--rule);

    .tab {
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
      border: none;
      background: none;
      font-family: var(--font);
    }
    .tab:hover { color: var(--ink); background: rgba(255,255,255,0.04); }
    .tab.active { color: var(--brand); background: rgba(16,185,129,0.1); }

    /* Responsive */
    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
      .sidebar { order: 2; }
      .main { order: 1; }
    }
    @media (max-width: 600px) {
      .topbar-inner { flex-wrap: wrap; }
      .search-box { max-width: 100%; order: 3; width: 100%; }
      .stock-header { flex-direction: column; }
      .stock-price { text-align: left; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
      .macro-grid { grid-template-columns: 1fr; }
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    .empty-state h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: var(--ink);
    }

    /* Loading */
    .skeleton {
      background: linear-gradient(90deg, var(--bg2) 25%, rgba(255,255,255,0.05) 50%, var(--bg2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* AI 深度分析弹层 */
    .ai-modal { display:none; position:fixed; inset:0; z-index:1000;
      background:rgba(0,0,0,0.7); align-items:center; justify-content:center; padding:2rem; }
    .ai-modal-inner { position:relative; width:min(960px, 96vw); height:min(90vh, 1100px);
      background:#0f1117; border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
    .ai-modal-bar { display:flex; align-items:center; justify-content:space-between;
      padding:0.6rem 1rem; background:#1a1d28; border-bottom:1px solid #2a2e3a; }
    .ai-modal-bar .title { color:#5dade2; font-weight:bold; font-size:0.95rem; }
    .ai-modal-close { background:transparent; border:1px solid #2a2e3a; color:#d0d4dc;
      border-radius:6px; padding:0.25rem 0.7rem; cursor:pointer; font-size:0.85rem; }
    .ai-modal-close:hover { background:#252a38; }
    .ai-frame { flex:1; width:100%; border:0; background:#0f1117; }
    .ai-loading { position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:1rem; background:#0f1117; color:#7a8090; }
    .ai-spinner { width:42px; height:42px; border:4px solid #2a2e3a; border-top-color:#5dade2;
      border-radius:50%; animation:ai-spin 0.9s linear infinite; }
    @keyframes ai-spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <div class="logo-icon">&#128200;</div>
        <span>A股智能分析看板</span>
      </div>
      <div class="search-box">
        <input type="text" id="stockInput" placeholder="输入股票名称或代码 (如: 贵州茅台 / 600519)" />
        <button class="btn btn-primary" onclick="searchStock()">搜索</button>
      </div>
      <div style="display:flex;gap:0.5rem;">
        <a href="watchlist.html" class="btn btn-secondary" style="text-decoration:none;display:inline-flex;align-items:center;gap:0.3rem;">&#9733; 自选股票</a>
        <button class="btn btn-secondary" onclick="addToWatchlist()">+ 加入自选</button>
        <button class="btn btn-secondary" onclick="openAiReport()" title="调用后端多 Agent 分析引擎，生成深度分析报告">🤖 深度分析</button>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast" style="display:none;"></div>

  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="card">
        <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
          <span>&#9733; 我的自选</span>
          <div style="display:flex;gap:0.3rem;">
            <button onclick="importWatchlistFile()" style="font-size:0.7rem;padding:0.2rem 0.5rem;background:var(--bg2);border:1px solid var(--rule);border-radius:4px;color:var(--ink);cursor:pointer;" title="从数据文件导入">&#128229; 导入</button>
          </div>
        </div>
        <div id="watchlist" class="watchlist">
          <div class="empty-state" style="padding:1rem;">
            <div style="font-size:1.5rem;margin-bottom:0.5rem;">&#128221;</div>
            <div style="font-size:0.85rem;">暂无自选股票<br>搜索并添加</div>
          </div>
        </div>
        <div style="padding:0.5rem 1rem;border-top:1px solid var(--rule);font-size:0.7rem;color:var(--muted);line-height:1.4;">
          &#128161; 自选股自动保存在浏览器 localStorage；可用"导入"从备份文件恢复
        </div>
      </div>

      <div class="card">
        <div class="card-title">&#128293; 行业热度排行</div>
        <div id="sectorList" class="sector-list"></div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Market Index Panel (A股大盘走势) -->
      <div class="panel" id="marketIndexPanel">
        <div class="panel-header">
          <div class="panel-title">&#128200; A股大盘走势</div>
          <span class="badge badge-info" id="indexUpdateBadge">实时</span>
        </div>
        <div id="marketIndexList" class="market-index-grid">
          <div class="empty-state" style="padding:1.5rem;">
            <div style="font-size:0.85rem;color:var(--muted);">加载中…</div>
          </div>
        </div>
      </div>

      <!-- Stock Overview -->
      <div class="panel" id="stockPanel">
        <div class="empty-state">
          <div class="empty-state-icon">&#128269;</div>
          <h3>搜索股票开始分析</h3>
          <p>在上方搜索框输入股票名称或代码，获取实时估值分析与资讯</p>
        </div>
      </div>

      <!-- Macro News Panel (国内及国际经济大新闻) -->
      <div class="panel" id="macroNewsPanel">
        <div class="panel-header">
          <div class="panel-title">&#128240; 国内及国际经济大新闻</div>
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <span class="badge badge-info" id="newsUpdateBadge">加载中…</span>
            <button class="btn-refresh" id="newsRefreshBtn" onclick="refreshNews()" title="刷新新闻（保留重要消息）">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
              刷新
            </button>
          </div>
        </div>
        <div class="tabs">
          <button class="tab active" onclick="switchNewsTab(this, 'all')">全部</button>
          <button class="tab" onclick="switchNewsTab(this, 'watchlist')">★自选相关</button>
          <button class="tab" onclick="switchNewsTab(this, 'policy')">政策</button>
          <button class="tab" onclick="switchNewsTab(this, 'industry')">行业</button>
          <button class="tab" onclick="switchNewsTab(this, 'company')">企业</button>
          <button class="tab" onclick="switchNewsTab(this, 'urgent')">重要</button>
        </div>
        <div id="macroNewsList" class="macro-news-list">
          <div class="empty-state" style="padding:2rem;">
            <div style="font-size:1.5rem;margin-bottom:0.5rem;">&#128240;</div>
            <div style="font-size:0.85rem;color:var(--muted);">正在抓取主流财经媒体快讯…</div>
          </div>
        </div>
        <div style="padding:0.5rem 0.2rem 0;font-size:0.7rem;color:var(--muted);text-align:center;line-height:1.5;">
          &#128161; 数据来源：东方财富 7×24 全球财经直播 · 聚合证券时报、华尔街见闻、财联社等主流财经媒体 · 60秒自动刷新
        </div>
      </div>
    </main>
  </div>

  <script src="./_shared/js/echarts.min.js"></script>
  <script>
    // 自选种子数据（内联，避免 file:// 协议下浏览器缓存问题）
    window.__STOCK_WATCHLIST_SEED__ = [
      { "code": "600519", "name": "贵州茅台" },
      { "code": "300750", "name": "宁德时代" },
      { "code": "002594", "name": "比亚迪" },
      { "code": "601318", "name": "中国平安" },
      { "code": "600036", "name": "招商银行" },
      { "code": "300433", "name": "蓝思科技" },
      { "code": "600667", "name": "太极实业" }
    ];
  </script>
  <script src="./assets/app.js?v=20260803c"></script>

  <!-- AI 深度分析弹层（iframe 加载本地 /api/analyze 生成的报告） -->
  <div class="ai-modal" id="aiReportModal">
    <div class="ai-modal-inner">
      <div class="ai-modal-bar">
        <span class="title">🤖 AI 多 Agent 深度分析报告</span>
        <button class="ai-modal-close" onclick="closeAiReport()">✕ 关闭</button>
      </div>
      <div class="ai-loading" id="aiReportLoading">
        <div class="ai-spinner"></div>
        <div>正在调用后端分析引擎，首次分析约需 10~30 秒，请稍候…</div>
      </div>
      <iframe class="ai-frame" id="aiReportFrame" src="about:blank"></iframe>
    </div>
  </div>
</body>
</html>

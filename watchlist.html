      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
    .td-volume {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .td-chart {
      width: 120px;
      padding: 0.4rem 0.5rem !important;
    }
    .mini-sparkline {
      width: 100px;
      height: 32px;
    }

    .up { color: var(--accent); }
    .down { color: var(--danger); }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }
    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    .empty-state h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: var(--ink);
    }
    .empty-state p {
      margin-bottom: 1.5rem;
    }
    .btn-primary {
      display: inline-block;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16,185,129,0.3); }

    /* Remove btn */
    .remove-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .remove-btn:hover { color: #ef4444; background: rgba(239,68,68,0.1); }

    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .status-up { background: rgba(239,68,68,0.15); color: var(--accent); }
    .status-down { background: rgba(16,185,129,0.15); color: var(--danger); }
    .status-flat { background: rgba(156,163,175,0.15); color: #9ca3af; }

    /* Last update */
    .last-update {
      text-align: right;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 1rem;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    @media (max-width: 600px) {
      .page-header { flex-direction: column; align-items: flex-start; }
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

      <div class="summary-card">

        </div>
      </div>
      <div id="newsSectionContent"></div>
    </section>
  </div>
